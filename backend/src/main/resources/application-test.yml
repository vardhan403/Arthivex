server:
  port: 0

spring:
  application:
    name: finguard-backend-test

  datasource:
    url: jdbc:h2:mem:finguard_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  name: "Arthivex Test Harness"
  version: "1.0.0-test"
  cors:
    allowed-origins: "http://localhost:5173"
  jwt:
    secret: "test-environment-secret-key-with-sufficient-entropy-for-testing"
    expiration-minutes: 30
    issuer: "finguard-test-auth"

