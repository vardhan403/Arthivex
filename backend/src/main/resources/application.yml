server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: finguard-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finguard}
    username: ${DB_USERNAME:finguard_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: FinGuardHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms

app:
  name: "Arthivex Secure Financial Ledger"
  version: "1.0.0"
  admin:
    bootstrap-secret: ${ADMIN_BOOTSTRAP_SECRET:finguard-admin-bootstrap-secret-2026}
  rate-limit:
    enabled: true
    max-attempts: 5
    window-seconds: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:finguard-super-secure-production-jwt-signing-secret-key-minimum-256-bits-required!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    issuer: ${JWT_ISSUER:finguard-auth-service}

